<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <!-- Botón para regresar al listado -->
      <ion-back-button defaultHref="/responsables"></ion-back-button>
    </ion-buttons>
    <ion-title>Registrar Responsable</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item>
      <ion-label position="stacked">Identificación <ion-text color="danger">*</ion-text></ion-label>
      <ion-input type="text" [(ngModel)]="nuevoResponsable.identificacion" placeholder="Ej. 101110111"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Nombre <ion-text color="danger">*</ion-text></ion-label>
      <ion-input type="text" [(ngModel)]="nuevoResponsable.nombre"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Primer Apellido <ion-text color="danger">*</ion-text></ion-label>
      <ion-input type="text" [(ngModel)]="nuevoResponsable.primerApellido"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Segundo Apellido</ion-label>
      <ion-input type="text" [(ngModel)]="nuevoResponsable.segundoApellido"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Teléfono</ion-label>
      <ion-input type="tel" [(ngModel)]="nuevoResponsable.telefono"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Correo Electrónico</ion-label>
      <ion-input type="email" [(ngModel)]="nuevoResponsable.correo"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label>Tipo de Responsable</ion-label>
      <ion-select [(ngModel)]="nuevoResponsable.tipoResponsable" interface="action-sheet">
        <ion-select-option value="estudiante">Estudiante</ion-select-option>
        <ion-select-option value="docente">Docente</ion-select-option>
        <ion-select-option value="administrativo">Administrativo</ion-select-option>
      </ion-select>
    </ion-item>
  </ion-list>

  <ion-button expand="block" color="primary" class="ion-margin-top" (click)="guardarResponsable()">
    <ion-icon name="save-outline" slot="start"></ion-icon>
    Guardar Responsable
  </ion-button>
</ion-content>
